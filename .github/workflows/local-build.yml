name: T3Learn local build

# The local edition's release step (owner, 2026-10-28): every push to main
# that passes the gates becomes an unsigned Apple Silicon T3Learn.app on the
# rolling `local-latest` prerelease: the zip the installed app updates from
# (electron/local-update.cjs reads the manifest and offers the build in the
# sidebar) and the DMG under the stable name T3Learn.dmg, the link for a
# website. Manual runs build and smoke the app but publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  build:
    name: Build and publish (mac-arm64)
    needs: gates
    # Standard macos-15 runners are Apple Silicon. The local config uses the
    # flat icns icon, so no Xcode 26 / actool is needed here.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Build the unsigned T3Learn zip and DMG
        env:
          LH_BUILD_NUMBER: ${{ github.run_number }}
          LH_BUILD_COMMIT: ${{ github.sha }}
          LH_LOCAL_UPDATE_REPO: ${{ github.repository }}
        run: node scripts/build-local.mjs --zip --dmg
      - name: Boot the packaged server in the app's own Electron
        run: node scripts/smoke-server.mjs --electron
      - name: Initialize packaged providers offline (packaged Electron Node)
        run: |
          app="dist/local/mac-arm64/T3Learn.app/Contents"
          node scripts/smoke-provider-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/T3Learn"
      - name: Publish to the local-latest prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-local-build.mjs --dist dist/local --repo "$GITHUB_REPOSITORY" --tag local-latest --build "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
